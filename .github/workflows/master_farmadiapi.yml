# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: CI/CD - Despliegue API .NET 8 a Azure App Service

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'api-cloud-farmaDi'
  DOTNET_VERSION: '8.0.x'
  OUTPUT_PATH: '${{ github.workspace }}/publish'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar entorno .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restaurar dependencias
      run: dotnet restore

    - name: Compilar proyecto (Release)
      run: dotnet build --configuration Release --no-restore

    - name: Publicar artefactos
      run: dotnet publish FarmaDiApi/FarmaDiApi.csproj -c Release -o ${{ env.OUTPUT_PATH }}

    - name: Desplegar hacia Azure WebApp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.OUTPUT_PATH }}
